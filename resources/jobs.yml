resources:
  jobs:
    forward_etl:
      name: "customer360 forward-ETL (${bundle.target})"
      tasks:
        - task_key: drain_staging
          notebook_task:
            notebook_path: ../capstone-app/lakebase/forward_etl/pattern_a_psycopg2/drain_staging.py
            base_parameters:
              catalog: ${var.catalog}
              pghost: "ep-billowing-cake-d7ma4pcu.database.eu-central-1.cloud.databricks.com"
              pgdatabase: "capstone_db"
              lakebase_endpoint: "projects/capstone-pg/branches/production/endpoints/primary"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
            # pg8000 is a PURE-PYTHON Postgres driver (no native libs). The
            # workspace mandates serverless compute, and binary Postgres wheels
            # (psycopg3[binary], psycopg2-binary) SIGABRT loading libpq on the
            # serverless runtime. pg8000 has nothing native to load.
            dependencies:
              - "pg8000"
              - "databricks-sdk"
